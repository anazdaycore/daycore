# nginx — serve the frontend at / and reverse-proxy the Go API at /api on the
# same origin, so the httpOnly cookies just work and no CORS is needed.
#
# ── Three lines here are load-bearing; changing them breaks things quietly ──
#
#   proxy_set_header Host $host
#       NGINX'S DEFAULT IS WRONG FOR US. `proxy_pass` without this sets Host to
#       the upstream address, so the app sees Host: app:8080 while the browser
#       sends Origin: https://your.domain — and the admin console's CSRF check
#       refuses every request with a 403 that looks like a bug in the app.
#       (The app also accepts PUBLIC_BASE_URL and, with TRUST_PROXY_HEADERS,
#       X-Forwarded-Host — so a deployment that gets this wrong is recoverable.
#       Getting it right is still the point.)
#
#   proxy_buffering off
#       SSE (POST /api/ai/companion) is a stream. With buffering on, the user
#       watches a spinner until the whole answer is written.
#
#   Upgrade / Connection
#       WebSocket. Needed for the reverse-WS channel mode (a bot connecting IN)
#       and for anything wss later. Without them the handshake gets a 200 and
#       the socket never opens.
#
# ── TLS ──
#
# Terminate TLS here, not in the app. Then set in the app's environment:
#   PUBLIC_BASE_URL=https://your.domain   (identity: OAuth redirects + CSRF)
#   SECURE_COOKIES=true                   (it is already the production default)
#   TRUST_PROXY_HEADERS=true              (ONLY behind a proxy you control —
#                                          otherwise clients forge X-Forwarded-For
#                                          and walk around the per-IP rate limits)
#
# ⚠️ An intranet install on plain http must leave SECURE_COOKIES=false: a Secure
# cookie is never sent over http, so turning it on there locks the operator out
# of their own console with no error message anywhere.
#
# The upstream port is normally not exposed anyway (compose does not publish it),
# so nothing special is needed. Just do not run this AND publish the app's own
# port on the same host — then nginx becomes optional from the outside, and with
# it go the rate limits and the TLS.
#
# Put the frontend build output (e.g. Vite `dist/`) at /usr/share/nginx/html.

upstream daycore_api {
    server app:8080;   # docker-compose service name (or 127.0.0.1:8080)
}

# WebSocket upgrade: "upgrade" when the client asked for one, "close" otherwise.
# A bare `proxy_set_header Connection "upgrade"` breaks every ordinary request.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the static frontend
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # hashed assets → cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API + SSE + WebSocket
    location /api/ {
        proxy_pass http://daycore_api;
        proxy_http_version 1.1;

        # See the header of this file: without Host $host the admin console 403s.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket (reverse-WS channels, and anything wss later).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Server-Sent Events (POST /api/ai/companion): stream, don't buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # The operations console, served BY THE BINARY at /admin (embedded; see
    # internal/server/console.go — it registers both /admin and /admin/).
    #
    # ⚠️ Without this rule the SPA fallback below wins and the console 404s: the
    # app is up, the frontend is up, and the only page that can tell you what is
    # wrong is the one you cannot open. `^~` covers /admin and /admin/*.
    location ^~ /admin {
        proxy_pass http://daycore_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
